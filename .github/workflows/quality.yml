name: Quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./test.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Report full dependency audit (informational)
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e 'const audit = require("/tmp/npm-audit.json"); console.log("npm audit:", JSON.stringify(audit.metadata.vulnerabilities));'
      - name: Gate high-severity production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t phoneme-builder-assessment2 .
      - name: Start production container
        run: docker run --detach --name phoneme-a2 --publish 3000:3000 --volume phoneme-data:/data phoneme-builder-assessment2
      - name: Verify health and activity APIs
        run: |
          set -eu
          status="000"
          for attempt in $(seq 1 30); do
            status="$(curl --silent --output /tmp/health.json --write-out "%{http_code}" http://127.0.0.1:3000/health || true)"
            if [ "$status" = "200" ] && [ "$(cat /tmp/health.json)" = '{"status":"ok"}' ]; then
              break
            fi
            sleep 1
          done
          test "$status" = "200"
          test "$(cat /tmp/health.json)" = '{"status":"ok"}'
          activities_status="$(curl --silent --output /tmp/activities.json --write-out "%{http_code}" http://127.0.0.1:3000/api/activities)"
          test "$activities_status" = "200"
          test "$(cat /tmp/activities.json)" = "[]"
      - name: Show container logs
        if: always()
        run: docker logs phoneme-a2 || true
      - name: Stop and remove container
        if: always()
        run: docker rm --force phoneme-a2 || true

  browser-and-accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./test.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:persistence
      - name: Lighthouse accessibility audits
        run: |
          export CHROME_PATH="$(node -e 'console.log(require("playwright").chromium.executablePath())')"
          npm run test:accessibility
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assessment3-browser-accessibility
          path: |
            playwright-report/
            test-results/
            evidence/
          retention-days: 30

  load-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: file:./test.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - name: Install Apache JMeter
        run: |
          curl --fail --location https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz --output /tmp/jmeter.tgz
          tar -xzf /tmp/jmeter.tgz -C /tmp
      - name: Reject malformed HTTP 200 generation outputs
        run: JMETER_BIN=/tmp/apache-jmeter-5.6.3/bin/jmeter node testing/jmeter/verify-assertions.mjs
      - name: Measure all finite user stages
        run: |
          export JMETER_BIN=/tmp/apache-jmeter-5.6.3/bin/jmeter
          export OUTPUT=/tmp/assessment3-load
          node scripts/run-with-server.mjs bash testing/jmeter/run-stages.sh
      - name: Retain completed or partial results
        if: always()
        run: |
          mkdir -p evidence/jmeter-ci
          if [ -d /tmp/assessment3-load ]; then cp -r /tmp/assessment3-load/. evidence/jmeter-ci/; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assessment3-jmeter
          path: evidence/jmeter-ci/
          retention-days: 30
